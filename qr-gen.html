<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🔧 Generate PMA Member QR Badge</title>
  <style>
    body {
      background: #1e1e1e;
      color: #00ffcc;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px;
    }
    .form-box, .badge {
      background: #111;
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 0 10px #00ffcc88;
    }
    input, button {
      padding: 12px;
      width: 80%;
      margin: 10px auto;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    button {
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    #badge-output {
      display: none;
      margin-top: 30px;
    }
    img {
      margin-top: 10px;
      width: 180px;
    }
  </style>
</head>
<body>

  <h1>🔧 Generate PMA Member QR Badge</h1>

  <div class="form-box">
    <p><strong>Enter member's full name</strong></p>
    <input type="text" id="fullName" placeholder="Full Name" required />
    <button onclick="generateBadge()">🔑 Generate Badge</button>
  </div>

  <div id="badge-output" class="badge">
    <h2 id="displayName"></h2>
    <p id="displayID"></p>
    <img id="qrCode" alt="QR Code" />
  </div>

  <script>
    let lastID = 13; // 🧠 CHANGE THIS to your latest member # (e.g. 13 means the next will be 14)

    function generateBadge() {
      const name = document.getElementById('fullName').value.trim();
      if (!name) {
        alert("Please enter a name.");
        return;
      }

      const nextID = 'RLEA-2025-' + String(lastID + 1).padStart(4, '0');
      const badgeURL = `https://robinsonvillagelegacy.org/badge.html?id=${nextID}`;

      document.getElementById('displayName').textContent = name;
      document.getElementById('displayID').textContent = `PMA ID: ${nextID}`;
      document.getElementById('qrCode').src =
        `https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=${encodeURIComponent(badgeURL)}`;

      document.getElementById('badge-output').style.display = 'block';

      // Optional: log to console or future storage
      console.log(`Generated for ${name}: ${nextID}`);
      lastID++; // Increment for next use
    }
  </script>

</body>
</html>
